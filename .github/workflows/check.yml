name: Vault standards
on:
  # Pull requests cover every other branch; a push is checked only where it lands on main.
  # If your default branch has another name, put it here.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer PR update cancels the run it supersedes. A push to main is never cancelled: each
# push checks its own commits (from its before-SHA), so cancelling one would leave those
# commits unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSH_REF: ${{ github.ref }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # The test suites fail, rather than skip, the secret-scan cases if gitleaks is missing.
      VAULT_KIT_REQUIRE_GITLEAKS: '1'
      # The runner's python3 (setup-python above), never a .venv from the checkout: make
      # uses it and does not put .venv/bin on PATH.
      PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Read the pinned gitleaks version
        id: gitleaks
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' scripts/gitleaks)
          test -n "${version}" || { echo "no VERSION in scripts/gitleaks" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # scripts/gitleaks checks the SHA-256 of a cached binary before running it, so a cache
      # hit only saves the download.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/vault-kit
          key: vault-kit-gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ steps.gitleaks.outputs.version }}
      - run: make check
      - name: Check the vault is initialized (instances only)
        run: |
          if [ "$(python3 scripts/vaultconf.py --template)" = "true" ]; then
            echo "Template repository (template = true); make check-initialized skipped."
          else
            make check-initialized
          fi
      - name: Find the base commit for history and secret checks
        id: base
        run: |
          default_ref="refs/heads/${DEFAULT_BRANCH}"
          skip=""
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
          elif [ "${PUSH_REF}" = "${default_ref}" ]; then
            # A push landing on the default branch itself (direct push or a
            # merged PR) is linear against its own prior tip; by the time this
            # job runs, origin's default-branch ref already IS this push's
            # HEAD, so fetching it and taking a merge-base would collapse to
            # HEAD and silently skip the check. Use the real pre-push tip.
            base="${PUSH_BEFORE_SHA}"
            case "${base}" in
              ""|*[!0]*) ;;
              *) skip="the first push to the default branch has no prior tip" ;;
            esac
          else
            # A feature branch that merged the default branch back into itself
            # diverges from that branch's own log; check against the nearest
            # common ancestor instead of this push's pre-push tip, which is
            # guaranteed to fail on such a merge (it can extend at most one
            # parent).
            # fetch-depth: 0 already fetched it; no credentials are kept for a re-fetch.
            base="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" HEAD)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      - name: Check source and log history
        env:
          BASE: ${{ steps.base.outputs.base }}
          SKIP: ${{ steps.base.outputs.skip }}
        run: |
          if [ -n "${SKIP}" ]; then
            echo "Skipping history check: ${SKIP}."
          else
            python3 scripts/check-history.py --base "${BASE}" --head HEAD
          fi
      - name: Scan new commits for secrets
        env:
          BASE: ${{ steps.base.outputs.base }}
          SKIP: ${{ steps.base.outputs.skip }}
        run: |
          # A commit made with --no-verify skipped the pre-commit scan; this step reads every
          # new commit's patch, merges included (git log -m: a merge's own resolution against
          # each parent), with --text so .gitattributes cannot hide a file. With no prior tip
          # to compare against, scan all of history.
          if [ -n "${SKIP}" ]; then
            echo "No base commit (${SKIP}); scanning all of history."
            SECRETS_BASE="" make secrets SECRETS_MODE=range
          else
            SECRETS_BASE="${BASE}" make secrets SECRETS_MODE=range
          fi
      - name: Scan new commits for denied names
        env:
          BASE: ${{ steps.base.outputs.base }}
          SKIP: ${{ steps.base.outputs.skip }}
        run: |
          # Every commit's message, path names and added lines against the base commit's
          # [redaction] deny list, including text a later commit removed.
          if [ -n "${SKIP}" ]; then
            SECRETS_BASE="" make deny-range
          else
            SECRETS_BASE="${BASE}" make deny-range
          fi
      - name: Private-name tripwire (template repository only)
        env:
          BASE: ${{ steps.base.outputs.base }}
          SKIP: ${{ steps.base.outputs.skip }}
          VAULT_KIT_TRIPWIRE: ${{ secrets.VAULT_KIT_TRIPWIRE }}
        run: |
          # The pattern list lives only in the VAULT_KIT_TRIPWIRE secret; committing it would
          # publish the names it guards. scripts/tripwire prints pattern numbers, never text.
          if [ "$(python3 scripts/vaultconf.py --template)" != "true" ]; then
            echo "Not the template repository; tripwire skipped."
          elif [ -z "${VAULT_KIT_TRIPWIRE}" ]; then
            echo "::notice title=Tripwire skipped::VAULT_KIT_TRIPWIRE is empty or unavailable to this run"
          elif [ -n "${SKIP}" ]; then
            python3 scripts/tripwire
          else
            python3 scripts/tripwire --base "${BASE}"
          fi
      - name: Test suites
        env:
          # test-init runs the tripwire over a freshly initialized vault's rendered skills
          # when this is set; it prints pattern numbers only, and an instance has no such
          # secret, so there it is empty and that leg is skipped.
          VAULT_KIT_TRIPWIRE: ${{ secrets.VAULT_KIT_TRIPWIRE }}
        run: make test
